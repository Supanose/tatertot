name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          unzip -q -o "$ZIP" -d src
      - name: Build
        run: |
          PROJ=$(dirname "$(find src -name settings.gradle.kts | head -n 1)")
          echo "Project folder: $PROJ"
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TaterTots.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TaterTots-apk
          path: TaterTots.apk
